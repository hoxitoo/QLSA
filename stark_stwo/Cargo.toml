[package]
name    = "qlsa-stark-stwo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qlsa-stark-stwo"
path = "src/main.rs"

[lib]
name = "qlsa_stark_stwo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["prover"]
prover  = ["stwo/prover", "stwo-constraint-framework/prover"]
python  = ["pyo3/extension-module"]

[dependencies]
stwo                      = { version = "2.2.0", features = ["prover"] }
stwo-constraint-framework = { version = "2.2.0", features = ["prover"] }
serde                     = { version = "1", features = ["derive"] }
serde_json                = "1"
hex                       = "0.4"
blake2                    = "0.10"
bincode                   = { version = "2", features = ["serde", "derive"] }
sha3                      = "0.10"
pyo3                      = { version = "0.29", optional = true }
zeroize                   = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1

# `cargo test` builds under `dev` (the `test` profile inherits from it), and an
# unoptimised Circle STARK prover is ~20x slower. MEASURED on 4 cores, same
# suite, 538 passed either way:
#
#   opt-level = 0 (the default)   445.84 s of tests, worst single test 326.1 s
#   opt-level = 3                  21.45 s of tests, worst single test  15.9 s
#   opt-level = 3, COLD compile   146 s for compile AND tests together
#
# That is why CI's 5-minute test step had been timing out since 2026-09-19: the
# tests alone exceeded it, and one test exceeded it by itself.
#
# This changes SPEED ONLY, not what the tests check: `debug-assertions` and
# `overflow-checks` are separate keys and still default to true under `dev`, so
# the integer-overflow panics that catch field-arithmetic mistakes remain on.
# Do not reach for `--release` instead — it disables exactly those checks, and
# this crate's release profile (lto + codegen-units = 1) is slow to build.
[profile.dev]
opt-level = 3

# Dependencies (stwo above all) do the bulk of the proving work.
[profile.dev.package."*"]
opt-level = 3
