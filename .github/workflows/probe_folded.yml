name: Measure folded nonce path

# Measures the FOLDED nonce path (Ф3.2) on Sepolia — a batch that also moves the
# nonce accumulator in one transaction (BatchRegistryV7.submitBatchWithNonceUpdates)
# — and the plain batch on the one-slot record, via
# contracts/scripts/probe_folded_nonce.js.
#
# Why: locally a nonce update inside the batch proof costs 2,119-3,335 gas,
# against the mapping path's 12,085 / 28,777 per sender, and it writes no new
# storage slot — the thing Sepolia prices +80,820 higher (sender_cost_sepolia).
# This checks the network leaves it there.
#
# Sends 2 transactions per part (a fresh registry, reusing the deployed
# verifier, and its batch): ~28M gas each, ~110M for all four — ~0.011 ETH at
# 0.1 gwei. The run of 2026-11-19 measured plain, 1 and 25; `statements: 150`
# finishes it for ~0.003 ETH. Raw figures are
# uploaded as the `folded-nonce` artifact and printed in the summary.
#
# Secrets: DEPLOYER_PRIVATE_KEY (required), SEPOLIA_RPC_URL (optional).

on:
  workflow_dispatch:
    inputs:
      verifier_address:
        description: "QLSAVerifierRecursive to reuse (deployments/sepolia.json -> v8)"
        required: true
        default: "0x78dcad37c260F39DEE07b08856BC57DC8EC64a66"
      statements:
        description: "Parts to run: plain,1,25,150 (a rerun can name only what is missing, e.g. 150)"
        required: true
        default: "plain,1,25,150"
      min_gas_price_gwei:
        description: "Gas price floor in gwei (the node's suggestion is used when higher)"
        required: true
        default: "0.1"

jobs:
  probe:
    name: Folded nonce path on Sepolia
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm install

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      # Same pricing rule as the sends (scripts/_testnet.js). The whole run is
      # ~28M gas per part (a registry deploy + a batch); require 31M x price per
      # part so a mid-run price rise does not strand it.
      - name: Check inputs and balance
        working-directory: contracts
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          VERIFIER: ${{ github.event.inputs.verifier_address }}
          FLOOR_GWEI: ${{ github.event.inputs.min_gas_price_gwei }}
          PARTS: ${{ github.event.inputs.statements }}
        run: |
          [[ "$PARTS" =~ ^(plain|1|25|150)(,(plain|1|25|150))*$ ]] \
            || { echo "::error::statements must be a comma list of plain,1,25,150"; exit 1; }
          [ -n "$PRIVATE_KEY" ] || { echo "::error::secret DEPLOYER_PRIVATE_KEY is not set"; exit 1; }
          [[ "$VERIFIER" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "::error::verifier_address is not an address"; exit 1; }
          [[ "$FLOOR_GWEI" =~ ^[0-9]+([.][0-9]{1,9})?$ ]] \
            || { echo "::error::min_gas_price_gwei must be a non-negative number with at most 9 decimals"; exit 1; }
          node -e '
            const { ethers } = require("ethers");
            (async () => {
              const p = new ethers.JsonRpcProvider(process.env.RPC);
              const net = await p.getNetwork();
              if (net.chainId !== 11155111n) { console.error("not Sepolia"); process.exit(1); }
              if ((await p.getCode(process.env.VERIFIER)) === "0x") { console.error("no contract at verifier_address"); process.exit(1); }
              const w = new ethers.Wallet(process.env.PRIVATE_KEY, p);
              const bal = await p.getBalance(w.address);
              const floor = ethers.parseUnits(process.env.FLOOR_GWEI, "gwei");
              const suggested = BigInt(await p.send("eth_gasPrice", []));
              const price = suggested > floor ? suggested : floor;
              const parts = BigInt(process.env.PARTS.split(",").length);
              const need = 31_000_000n * parts * price;
              console.log("sender  :", w.address);
              console.log("balance :", ethers.formatEther(bal), "ETH");
              console.log("gasPrice:", ethers.formatUnits(price, "gwei"), "gwei -> the run needs ~", ethers.formatEther(need), "ETH");
              require("fs").appendFileSync(process.env.GITHUB_ENV, "QLSA_MIN_GAS_PRICE_WEI=" + floor.toString() + "\n");
              if (bal < need) { console.error("balance does not cover the run at this gas price"); process.exit(1); }
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Measure
        working-directory: contracts
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          VERIFIER_ADDRESS: ${{ github.event.inputs.verifier_address }}
          RESULTS_PATH: /tmp/folded_nonce.json
          STATEMENTS: ${{ github.event.inputs.statements }}
        run: |
          npx hardhat run scripts/probe_folded_nonce.js --network sepolia --no-compile 2>&1 \
            | tee /tmp/probe_output.txt

      - name: Upload raw figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folded-nonce
          path: |
            /tmp/folded_nonce.json
            /tmp/probe_output.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          [ -f /tmp/probe_output.txt ] || exit 0
          {
            echo "## Folded nonce path on Sepolia"
            echo '```'
            cat /tmp/probe_output.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
