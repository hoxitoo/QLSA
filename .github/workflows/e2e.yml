name: E2E testnet

# Proves a batch of real ML-DSA-65 signatures with the v8 stack (aggregation
# tree → recursion, 20 FRI queries, 130-bit) and finalizes it on Sepolia
# through BatchRegistryV7.submitBatchWithNonces — the same command that was run
# end to end against a standalone node on 2026-10-08 (14,726,046 gas,
# finalized=True; measurements.json → live_node_runs).
#
# Until 2026-10-11 this workflow ran the DEFAULT stack (v7) against the May
# BatchRegistryV2 with hardcoded addresses; the registry is now an input, taken
# from the "Deploy contracts" job summary.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOYER_PRIVATE_KEY  required unless dry_run — the account that submits.
#                         It must hold Sepolia ETH (a batch is ~14.7M gas).
#   SEPOLIA_RPC_URL       optional but recommended — the public node rate-limits.
#
# Run a dry run first (dry_run=true, the default): it proves everything and
# stops before the transaction, so a setup problem costs no gas.

on:
  workflow_dispatch:
    inputs:
      registry_address:
        description: "BatchRegistryV7 address (from the Deploy contracts summary)"
        required: true
        default: "0x0000000000000000000000000000000000000000"
      txs:
        description: "Number of signed transactions in the batch"
        required: true
        default: "2"
      dry_run:
        description: "Dry-run (prove everything, skip the on-chain submission)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  e2e:
    name: E2E v8 — Sepolia (${{ github.event.inputs.txs }} txs, dry_run=${{ github.event.inputs.dry_run }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Catch a wrong input before ~15 minutes of building.
      - name: Check inputs
        shell: bash
        env:
          REGISTRY: ${{ github.event.inputs.registry_address }}
          TXS: ${{ github.event.inputs.txs }}
          DRY: ${{ github.event.inputs.dry_run }}
          KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          [[ "$TXS" =~ ^[0-9]+$ ]] && [ "$TXS" -ge 1 ] && [ "$TXS" -le 64 ] \
            || { echo "::error::txs must be 1..64"; exit 1; }
          if [ "$DRY" = "false" ]; then
            [[ "$REGISTRY" =~ ^0x[0-9a-fA-F]{40}$ ]] && [ "$REGISTRY" != "0x0000000000000000000000000000000000000000" ] \
              || { echo "::error::registry_address must be the deployed BatchRegistryV7"; exit 1; }
            [ -n "$KEY" ] || { echo "::error::secret DEPLOYER_PRIVATE_KEY is not set"; exit 1; }
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Before the ~20-minute build: does the account cover the submission at
      # TODAY's gas price? testnet/submit.py sends a legacy tx with
      # gas=16,700,000 at eth_gasPrice, and the node wants all of it up front
      # (~14.7M is what gets charged). Skipped on a dry run, which sends nothing.
      - name: Check balance against the current gas price
        if: github.event.inputs.dry_run == 'false'
        shell: bash
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          pip install -q -r requirements-testnet.txt
          python - <<'PY'
          import os, sys
          from web3 import Web3
          w3 = Web3(Web3.HTTPProvider(os.environ["RPC_URL"]))
          if w3.eth.chain_id != 11155111:
              sys.exit(f"::error::RPC is chain {w3.eth.chain_id}, not Sepolia")
          addr = w3.eth.account.from_key(os.environ["KEY"]).address
          bal, gp = w3.eth.get_balance(addr), w3.eth.gas_price
          need = 16_700_000 * gp
          print(f"submitter: {addr}")
          print(f"balance  : {Web3.from_wei(bal, 'ether')} ETH")
          print(f"gasPrice : {Web3.from_wei(gp, 'gwei')} gwei -> submit needs {Web3.from_wei(need, 'ether')} ETH up front")
          if bal < need:
              sys.exit("::error::balance does not cover the submission at the current gas price — top up, or retry when gas is cheaper")
          PY

      # Same liboqs build as the CI python job, so the two cannot drift.
      - name: Cache liboqs build
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ~/liboqs-install
          key: liboqs-0.16.0-${{ runner.os }}

      - name: Build liboqs from source
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build libssl-dev
          git clone --branch 0.16.0 --depth 1 \
            https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build \
            -DCMAKE_INSTALL_PREFIX="${HOME}/liboqs-install" \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/liboqs/build --parallel $(nproc)
          cmake --install /tmp/liboqs/build

      - name: Make liboqs visible to liboqs-python
        run: |
          mkdir -p "${HOME}/_oqs"
          cp -r "${HOME}/liboqs-install/." "${HOME}/_oqs/"

      - name: Install Rust nightly for PyO3 extension
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-07-01

      - name: Cache Cargo (PyO3 extension)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stark_stwo/target
          key: cargo-stwo-pyo3-${{ runner.os }}-3.12-${{ hashFiles('stark_stwo/Cargo.lock') }}
          restore-keys: cargo-stwo-pyo3-${{ runner.os }}-

      # requirements-dev pulls in requirements-testnet (web3, eth-account,
      # python-dotenv) and maturin, each pinned in ONE place.
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build and install PyO3 extension
        working-directory: stark_stwo
        timeout-minutes: 30
        run: |
          rm -rf target/wheels/
          maturin build --features python --release
          pip install --force-reinstall target/wheels/*.whl

      # `shell: bash` gives `-eo pipefail`: without it the exit status is tee's,
      # and a failed submission would show as a green job.
      - name: Run E2E (--stack v8)
        shell: bash
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          REGISTRY_ADDRESS: ${{ github.event.inputs.registry_address }}
          TXS: ${{ github.event.inputs.txs }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY=""
          [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
          python -m testnet.e2e --stack v8 --txs "$TXS" $DRY 2>&1 | tee /tmp/e2e_output.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          [ -f /tmp/e2e_output.txt ] || exit 0
          {
            echo "## E2E result"
            echo '```'
            grep -E "gasUsed|finalized=|tx_hash=|E2E COMPLETE|130-bit|ERROR|Error" /tmp/e2e_output.txt || true
            echo '```'
            TX=$(grep -oE "tx_hash=[0-9a-f]{64}" /tmp/e2e_output.txt | head -1 | cut -d= -f2 || true)
            [ -n "$TX" ] && echo "Explorer: https://sepolia.etherscan.io/tx/0x$TX"
            echo ""
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/e2e_output.txt
            echo '```'
            echo "</details>"
          } >> $GITHUB_STEP_SUMMARY
